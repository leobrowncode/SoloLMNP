services:
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    env_file: [.env]
    volumes: ["./data:/data"]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
    restart: unless-stopped
