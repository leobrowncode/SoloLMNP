name: Noyau v1

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  noyau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Installer le moteur réutilisé
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff sur le noyau v1
        run: python -m ruff check lmnp_core scripts/lmnp.py --config lmnp_core/ruff.toml
      - name: Golden et propriétés
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest lmnp_core/tests -q
