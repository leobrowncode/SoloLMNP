[project]
name = "sololmnp-backend"
version = "0.1.0"
description = "Backend foundation for a self-hosted LMNP accounting application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "uvicorn[standard]>=0.32,<1",
]
[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.8,<1", "types-PyYAML>=6.0,<7", "PyYAML>=6.0,<7"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
