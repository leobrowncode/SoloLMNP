  "rules": [
    {
      "id": "RULE-LMNP-DEPRECIATION-LIMIT-001",
      "status": "executable",
      "effect_start": "2015-01-01",
      "effect_end": null,
      "source": "CGI art. 39 C, II-2 et II-3, version en vigueur depuis le 01/01/2015 (LOI n°2014-891 du 8 août 2014, art. 20). BOI-BIC-AMT-20-40-10-20 du 01/03/2017, II § 40 : l’amortissement déductible est la différence positive entre les loyers acquis et les autres charges. L’exemple du II retient 2 500 € de loyers, 1 000 € de charges et 3 050 € d’annuité : 1 500 € déductibles, 1 550 € reportés. BOI-FORM-000038 : l’état de suivi reporte le solde sur l’exercice suivant, sans colonne d’expiration.",
      "source_url": "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000029355753/2015-01-01",
      "consulted_at": "2026-10-30",
      "interpretation": "La dotation comptable 681 reste au ledger. La part déductible de l’exercice est limitée à la capacité (loyers moins autres charges, après réintégrations), sans devenir négative : l’amortissement ne crée ni n’augmente un déficit. L’excédent est un report d’amortissement non déduit, sans horizon de dix ans. Les reports d’exercices clôturés sont consommés ensuite en FIFO sur la capacité résiduelle. Ce stock n’est pas l’amortissement réputé différé aboli en 2004."
    },
    {
      "id": "RULE-LMNP-LOSS-001",
      "status": "executable",
      "effect_start": "2024-02-14",
      "effect_end": null,
      "source": "CGI art. 156, I, 1° ter, version en vigueur depuis le 01/07/2026 (LEGIARTI000053544806) : les déficits LMNP s’imputent exclusivement sur les revenus de cette activité au cours des dix années suivantes, tant qu’elle n’est pas professionnelle. BOI-BIC-DEF-20-20 du 12/09/2012, § 110-120. Notice DGFiP « Location meublée », modifiée le 23/04/2026. Le 1° bis est une autre règle et ne s’applique pas.",
      "source_url": "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000053544806",
      "consulted_at": "2026-10-30",
      "interpretation": "Un résultat fiscal négatif est un déficit LMNP reportable, distinct du registre d’amortissements. Il n’est pas imputé sur le revenu global. Sur un résultat fiscal positif, après plafonnement et consommation des amortissements reportés, les déficits d’exercices clôturés sont imputés en FIFO pendant les dix années suivantes. Au-delà, le solde est expiré. Hors calcul : passage en LMP et report en arrière."
    },
    {
      "id": "RULE-LAND-NON-DEPRECIABLE-001",
      "status": "executable",
      "effect_start": "2017-03-01",
      "effect_end": null,
      "source": "BOI-BIC-AMT-10-20, publication du 05/08/2026, I-A § 10 et I § 230 : le prix du sol est exclu de la base amortissable. Application LMNP rappelée au BOI-BIC-CHAMP-40-20. URL relue dans la documentation du projet le 02/10/2026, non relue in extenso le 30/10/2026.",
      "source_url": "https://bofip.impots.gouv.fr/bofip/4590-PGP.html/identifiant=BOI-BIC-AMT-10-20-20260805",
      "consulted_at": "2026-10-02",
      "interpretation": "Un terrain enregistré ne peut pas avoir de base amortissable. Le contrôle relit le registre. Il n’estime pas la ventilation terrain / construction."
    },
    {
      "id": "RULE-PARTIAL-CHARGE-001",
      "status": "executable",
      "effect_start": "2026-02-21",
      "effect_end": null,
      "source": "CGI art. 39, 1, al. 1, version en vigueur depuis le 21/02/2026 (LEGIARTI000044978650) : le bénéfice net est établi sous déduction de toutes charges. La quote-part sans lien avec l’activité n’est pas une charge déductible. Le montant est celui confirmé par l’utilisateur, pas une estimation.",
      "source_url": "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000044978650",
      "consulted_at": "2026-10-30",
      "interpretation": "L’utilisateur confirme un montant non déductible, plafonné par le solde de charge du compte, hors comptes 681. Le ledger n’est pas modifié. La réintégration augmente la capacité d’amortissement."
    },
    {
      "id": "RULE-LMNP-BIC-001",
      "status": "scope",
      "effect_start": null,
      "effect_end": null,
      "source": "Périmètre produit : activité déclarée LMNP. L’art. 155, IV définit le loueur professionnel par les seuils du foyer. Ces seuils ne sont pas calculés. Notice DGFiP « Location meublée », modifiée le 23/04/2026.",
      "source_url": "https://www.impots.gouv.fr/particulier/location-meublee",
      "consulted_at": "2026-10-30",
      "interpretation": "L’utilisateur déclare une activité LMNP. Aucun seuil de recettes ni comparaison avec les autres revenus du foyer n’est calculé. Les règles LMP ne sont pas appliquées."
    },
    {
