  "rules": [
    {
      "id": "RULE-LMNP-DEPRECIATION-LIMIT-001",
      "status": "executable",
      "effect_start": "2015-01-01",
      "source": "CGI art. 39 C, version en vigueur au 01/01/2015, et BOI-BIC-AMT-20-40-10-20",
      "interpretation": "La dotation comptable 681 reste au ledger. La part déductible de l'exercice est limitée à la capacité (loyers moins autres charges déductibles, après réintégrations). L'excédent constitue un report d'amortissement non déduit. Les reports antérieurs d'exercices CLOTURÉS sont consommés ensuite en FIFO (plus ancien d'abord) sur la capacité résiduelle. Les registres d'origine ne sont pas mutés : la consommation est tracée dans le calcul courant."
    },
    {
      "id": "RULE-LMNP-LOSS-001",
      "status": "executable",
      "effect_start": "2024-02-14",
      "source": "BOI-BIC-CHAMP-40-20, III-A, renvoyant au CGI art. 156 I 1° ter",
      "interpretation": "Un résultat fiscal négatif est un déficit LMNP reportable, distinct du registre d'amortissements. Il n'est pas imputé sur le revenu global. Sur un résultat fiscal positif (après plafonnement et consommation des amortissements reportés), les déficits antérieurs d'exercices CLOTURÉS sont imputés en FIFO dans la limite de dix années. Hors MVP : changement de statut LMP/LMNP, report en arrière."
    },
    {
      "id": "RULE-LAND-NON-DEPRECIABLE-001",
      "status": "executable",
      "effect_start": "2017-03-01",
      "source": "BOI-BIC-AMT-10-20 et BOI-BIC-CHAMP-40-20",
      "interpretation": "Un terrain enregistré ne peut pas avoir de base amortissable. Le contrôle relit le registre, sans estimer de ventilation."
    },
    {
      "id": "RULE-PARTIAL-CHARGE-001",
      "status": "executable",
      "effect_start": "2025-01-01",
      "source": "Principe de réintégration : la charge reste entière au ledger, seule la quote-part non déductible déclarée est ajoutée.",
      "interpretation": "L'utilisateur confirme un montant non déductible, plafonné par le solde de charge du compte, hors comptes 681. Le ledger n'est pas modifié."
    },
    {
      "id": "RULE-LMNP-BIC-001",
      "status": "scope",
      "effect_start": null,
      "source": "Périmètre produit : activité déclarée LMNP. Le LMP (CGI art. 155 IV) n'est pas traité.",
      "interpretation": "L'utilisateur déclare une activité LMNP. Aucun seuil de recettes ni comparaison avec les autres revenus du foyer n'est calculé. Les règles LMP ne sont pas appliquées."
    }
  ]
